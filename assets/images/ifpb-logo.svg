<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <style>
      .if-red { fill: #c62828; }
      .if-green { fill: #1b5e20; }
      .text-bold { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 800; fill: #1b5e20; font-size: 15px; letter-spacing: -0.2px; }
      .text-reg { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 600; fill: #2e7d32; font-size: 13.5px; }
      .text-campus { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 500; fill: #555555; font-size: 11.5px; letter-spacing: 0.3px; }
    </style>
  </defs>
  <!-- IF Símbolo Institucional -->
  <g transform="translate(4, 8)">
    <!-- Linha 1 -->
    <circle cx="9" cy="9" r="9" class="if-red" />
    <rect x="23" y="0" width="18" height="18" rx="3.5" class="if-green" />
    <rect x="46" y="0" width="18" height="18" rx="3.5" class="if-green" />
    
    <!-- Linha 2 -->
    <rect x="0" y="23" width="18" height="18" rx="3.5" class="if-green" />
    <rect x="23" y="23" width="18" height="18" rx="3.5" class="if-green" />
    <rect x="46" y="23" width="18" height="18" rx="3.5" class="if-green" />
    
    <!-- Linha 3 -->
    <rect x="0" y="46" width="18" height="18" rx="3.5" class="if-green" />
    <rect x="23" y="46" width="18" height="18" rx="3.5" class="if-green" />
  </g>
  
  <!-- Linha divisória sutil -->
  <line x1="82" y1="12" x2="82" y2="68" stroke="#d5dcd6" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Textos Institucionais -->
  <g transform="translate(94, 25)">
    <text x="0" y="0" class="text-bold">INSTITUTO FEDERAL</text>
    <text x="0" y="19" class="text-reg">Paraíba</text>
    <text x="0" y="37" class="text-campus">Campus Monteiro</text>
  </g>
</svg>
